<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13l-4-3-4 3-4-3V11a3 3 0 0 1 3-3z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved appearance before the first paint, to avoid a flash of the wrong theme.
      try {
        var saved = JSON.parse(localStorage.getItem('codex.theme') || '{}')
        if (saved.mode && saved.mode !== 'system') document.documentElement.dataset.theme = saved.mode
        if (saved.accent) document.documentElement.dataset.accent = saved.accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
