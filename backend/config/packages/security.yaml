security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Requests carrying an X-API-Key header (AI clients, scripts). Stateless: no session, no cookie.
        api_key:
            request_matcher: App\Security\ApiKeyRequestMatcher
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

        # Everything else: the Vue app, with a login session that lasts one year.
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\ApiSecurityHandler
            json_login:
                check_path: /api/auth/login
                username_path: username
                password_path: password
                success_handler: App\Security\ApiSecurityHandler
                failure_handler: App\Security\ApiSecurityHandler
            logout:
                path: /api/auth/logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000
                always_remember_me: true
                samesite: lax
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            access_denied_handler: App\Security\ApiSecurityHandler

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/errors$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
